name: Dev image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build and publish to :dev'
        required: true
        default: master
  pull_request_target:
    types: [labeled]

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'publish-dev-image' }}
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.pull_request.head.sha }}

  build-and-push-dev:
    needs: [test]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'publish-dev-image' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: Resolve git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIT_SHA=${{ steps.git-sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
