name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}
            VITE_GIT_SHA=${{ steps.git-sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Place frontend dist for Go embed
        run: |
          mkdir -p backend/frontend/dist
          cp -r frontend/dist/. backend/frontend/dist/

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cross-compile binaries
        working-directory: backend
        run: |
          for target in "darwin amd64" "darwin arm64" "linux amd64" "linux arm64"; do
            set -- $target
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -o "../groceries-$1-$2" .
          done

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            groceries-darwin-amd64
            groceries-darwin-arm64
            groceries-linux-amd64
            groceries-linux-arm64
